name: OS ONE tests
on:
  push:
    paths: ['os-one/**', '.github/workflows/os-one-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s os-one -p 'test_*.py' -v
