<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OS ONE — Demo</title><style>body{font:16px system-ui;background:#101e30;color:#fff;max-width:650px;margin:40px auto;padding:20px}label{display:block;margin:16px 0}select,button{display:block;width:100%;padding:12px;font:inherit;border-radius:8px}button{background:#8de1cb;border:0;margin:12px 0;color:#102638}article{white-space:pre-wrap;background:#20344a;padding:20px;border-radius:12px}</style><h1>OS ONE</h1><p>Business opportunity explorer — free demonstration</p><p>Planned price: €2.99. No payments or personal data collection.</p><form id="f"><label>Market<select id="market"><option>Europe</option><option>North America</option><option>Middle East</option><option>Asia</option></select></label><label>Budget<select id="budget"><option>€0–500</option><option>€500–5,000</option><option>€5,000+</option></select></label><label>Sector<select id="sector"><option value="research">Business research</option><option value="trade">International trade</option><option value="logistics">Logistics</option></select></label><button>Generate free sample</button></form><article id="out" hidden aria-live="polite"></article><button id="save" hidden>Save report</button><script>const ideas={research:"Offer public-source competitor research to specialist agencies.",trade:"Test commission-based introductions between verified suppliers and buyers.",logistics:"Offer shipment cost benchmarking using authorized data."};const f=document.getElementById("f"),out=document.getElementById("out"),save=document.getElementById("save");f.addEventListener("submit",e=>{e.preventDefault();out.textContent=["OS ONE — SAMPLE",document.getElementById("market").value,document.getElementById("budget").value,ideas[document.getElementById("sector").value],"1. Interview five prospective customers.","2. Confirm demand, scope and price before spending.","3. Verify contracting and invoicing arrangements.","4. Measure delivery cost and customer feedback.","Template-based demo; no live market data, AI generation or guaranteed income."].join("\n\n");out.hidden=false;save.hidden=false});save.onclick=()=>{const u=URL.createObjectURL(new Blob([out.textContent],{type:"text/plain"}));const a=document.createElement("a");a.href=u;a.download="os-one-sample.txt";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></html>
